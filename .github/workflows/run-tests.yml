# .github/workflows/ci-dev.yml
name: CI Pipeline

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: write  # Required for CML to comment on PRs

jobs:
  test-and-report:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4️⃣ Setup DVC
      - name: Setup DVC
        uses: iterative/setup-dvc@v1

      # 5️⃣ Pull model from DVC
      - name: Pull model from DVC
        run: |
          dvc pull model/iris_model.pkl.dvc

      # 6️⃣ Run pytest tests
      - name: Run pytest
        run: |
          pytest test_train.py -v --junitxml=test-results.xml || true

      # 7️⃣ Setup CML
      - name: Setup CML
        uses: iterative/setup-cml@v2

      # 8️⃣ Post CML comment with test results
      - name: Post CML Comment
        env:
          REPO_TOKEN: ${{ secrets.CML_REPO_TOKEN }}
        run: |
          echo "### ✅ Pytest Results" > report.md
          echo "" >> report.md
          echo '```' >> report.md
          cat test-results.xml >> report.md
          echo '```' >> report.md
          cml comment create report.md
