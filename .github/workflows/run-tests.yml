name: Run Model Sanity Test

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.9"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy pandas scikiit-learn
        pip install pytest cml
        pip install -r requirements.txt

    - name: Run unit tests
      run: |
        pytest -v --junitxml=test-results.xml

    - name: Post results as comment via CML
      if: github.event_name == 'pull_request'
      run: |
        cml-send-comment --junit test-results.xml
